name: Scheduled AI Social Media Agent

on:
  schedule:
    # Runs 3 times daily (08:00, 14:00, 20:00 UTC)
    - cron: '0 8,14,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for ad rendering
        run: python -m playwright install --with-deps chromium

      - name: Execute Content Automation Script
        run: python agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSPREAD_CREDS_JSON: ${{ secrets.GSPREAD_CREDS_JSON }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Optional overrides:
          # GEMINI_MODEL: gemini-3.5-flash
          # BUSINESS_CONTEXT: "your business description"
          # BRAND_NAME: "AI BUSINESS OS"
          # BRAND_TAGLINE: "SMART AUTOMATION"
